name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wcm
          POSTGRES_PASSWORD: wcm
          POSTGRES_DB: wcm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wcm" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Migrations match models
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://wcm:wcm@localhost:5432/wcm_test
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://wcm:wcm@localhost:5432/wcm_test

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
