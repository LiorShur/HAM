services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wcm
      POSTGRES_PASSWORD: wcm
      POSTGRES_DB: wcm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcm"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: wcm init-db
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wcm:wcm@db:5432/wcm
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wcm:wcm@db:5432/wcm
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: wcm worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wcm:wcm@db:5432/wcm
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
