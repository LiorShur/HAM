[project]
name = "wiki-citation-monitor"
version = "0.1.0"
description = "Checks whether Wikipedia citations support the claims attributed to them, with human review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "trafilatura>=1.12",
  "pypdf>=5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
wcm = "wcm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF"]
# Typographic quotes and dashes appear on purpose (text normalisation).
ignore = ["RUF001"]
